<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raghav Mirchandani</title>
<meta name="description" content="Personal site of Raghav Mirchandani.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>R</text></svg>">
<style>
  :root {
    --bg: #fbfbfa;
    --fg: #1a1a18;
    --muted: #6b6b66;
    --rule: #e2e2dd;
    --accent: #2f6f4e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14140f;
      --fg: #eceae4;
      --muted: #9a978e;
      --rule: #2e2e27;
      --accent: #7fc9a0;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14140f;
    --fg: #eceae4;
    --muted: #9a978e;
    --rule: #2e2e27;
    --accent: #7fc9a0;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 38rem;
    margin: 0 auto;
    padding: 5rem 16px 6rem;
  }

  h1 {
    font-size: 1.9rem;
    line-height: 1.2;
    letter-spacing: -0.02em;
    margin: 0 0 .4rem;
  }

  .tagline {
    color: var(--muted);
    margin: 0 0 2.5rem;
  }

  h2 {
    font-size: .78rem;
    text-transform: uppercase;
    letter-spacing: .09em;
    color: var(--muted);
    font-weight: 600;
    margin: 2.75rem 0 .9rem;
    padding-bottom: .5rem;
    border-bottom: 1px solid var(--rule);
  }

  p { margin: 0 0 1rem; }

  a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
  }
  a:hover { border-bottom-color: var(--accent); }

  ul.links {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  ul.links li {
    display: flex;
    gap: 1rem;
    padding: .55rem 0;
    border-bottom: 1px solid var(--rule);
  }
  ul.links li:last-child { border-bottom: 0; }
  ul.links .label {
    color: var(--muted);
    min-width: 6rem;
    flex-shrink: 0;
  }

  footer {
    margin-top: 4rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--rule);
    color: var(--muted);
    font-size: .85rem;
  }

  @media (max-width: 480px) {
    .wrap { padding-top: 3rem; }
    ul.links li { flex-direction: column; gap: .1rem; }
    ul.links .label { min-width: 0; font-size: .8rem; }
  }
</style>
</head>
<body>
  <main class="wrap">
    <h1>Raghav Mirchandani</h1>
    <p class="tagline">Engineer. <!-- TODO: replace with your one-line bio --></p>

    <h2>About</h2>
    <p>
      <!-- TODO: a short paragraph about what you do and what you care about. -->
      This is a placeholder. Edit <code>index.html</code> and push to update the site.
    </p>

    <h2>Elsewhere</h2>
    <ul class="links">
      <li><span class="label">GitHub</span>
        <a href="https://github.com/raghavmirchandani">@raghavmirchandani</a></li>
      <li><span class="label">Email</span>
        <a href="mailto:mirchandani.raghav@gmail.com">mirchandani.raghav@gmail.com</a></li>
      <!-- Add more: LinkedIn, X, Bluesky, resume PDF, etc. -->
    </ul>

    <footer>
      Built with plain HTML, hosted on GitHub Pages.
    </footer>
  </main>
</body>
</html>
